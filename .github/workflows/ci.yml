name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Download UCI dataset
        run: python -c "from credit_risk_platform.data_ingestion import download_raw_dataset; print(download_raw_dataset())"

      - name: Run Ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest